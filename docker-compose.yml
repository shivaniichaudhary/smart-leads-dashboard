version: '3.8'

services:
  backend-api:
    image: node:18-alpine
    container_name: crm_backend_container
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    command: sh -c "npm install && npm run dev"
    environment:
      - PORT=5000
      - JWT_SECRET=ServiceHiveSuperSecretEncryptionKey123!
    
  frontend-client:
    image: node:18-alpine
    container_name: crm_frontend_container
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend-api